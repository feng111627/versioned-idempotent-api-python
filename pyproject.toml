[project]
name = "versioned-idempotent-api-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[pytest]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = "-ra"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
